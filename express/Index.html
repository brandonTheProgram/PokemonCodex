<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.2/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        .region-button-container {
            display: flex;
            flex-wrap: wrap; /* Allow the buttons to wrap */
            justify-content: center; /* Center the buttons horizontally */
            gap: 10px; /* Add some space between the buttons */
        }
        
        .region-button {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 170px;
            height: 250px; /* Set a consistent height */
            padding: 10px 20px;
            margin: 0;
            font-size: 18px;
            font-weight: bold;
        }

        .region-button img {
            max-height: 300px;
            width: 100%; /* Stretch image to fit width */
            object-fit: contain;
        }

        body{
            background-color: rgb(170,169,173);
        }

        a {
            color: var(--bs-dark);
        }

    </style>
</head>
<body>
    <div class="container-xxl px-md-5 bg-white shadow-lg">
        <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
            <a href="/" class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none">
                <img src="/icons/Logo.svg" width="150" height="80" alt="Pokedex" title="Pokedex">
            </a>

            <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
                <li><a href="/" class="nav-link px-2 link-secondary">Home</a></li>
            </ul>

            <div class="col-md-3 text-end">
                <form method="POST" action="/search">
                    <input type="search" name="searchTerm" class="form-control" placeholder="Search..." aria-label="Search">
                </form>
            </div>
        </header>

        <main>
            <!-- Header Start -->
            <div class="row flex-lg-row-reverse align-items-center g-5 py-4 mb-4">
                <div class="col-12 col-lg-6">
                    <img src="/icons/Pokedex.png" width="525" height="300" class="d-block mx-lg-auto img-fluid" alt="Pokedex">
                </div>

                <div class="col-12 col-lg-6">
                    <h1 class="display-5 fw-bold mb-3">Welcome to the world of Pokémon</h1>
                    <p class="lead">
                        Explore the the vast world of Pokémon by learning about the creatures that inhabit the word.
                    </p>
                </div>
            </div>
            <!-- Header End -->

            <!--Region Start -->
            <div class="container">
                <div class="region-button-container">
                    <div class="region-button">
                        <a href="/region/Kanto" class="btn btn-primary text-center w-100 p-0 region-button" role="button">
                        <img src="/icons/Kanto.png" alt="Kanto Region" class="img-fluid rounded-top">
                        <div class="p-1">Kanto Region</div>
                        </a>
                    </div>
                    <div class="region-button">
                        <a href="/region/Johto" class="btn btn-primary text-center w-100 p-0 region-button" role="button">
                        <img src="/icons/Johto.png" alt="Johto Region" class="img-fluid rounded-top">
                        <div class="p-1">Johto Region</div>
                        </a>
                    </div>
                    <div class="region-button">
                        <a href="/region/Hoenn" class="btn btn-primary text-center w-100 p-0 region-button" role="button">
                        <img src="/icons/Hoenn.png" alt="Hoenn Region" class="img-fluid rounded-top">
                        <div class="p-1">Hoenn Region</div>
                        </a>
                    </div>
                    <div class="region-button">
                        <a href="/region/Sinnoh" class="btn btn-primary text-center w-100 p-0 region-button" role="button">
                        <img src="/icons/Sinnoh.png" alt="Sinnoh Region" class="img-fluid rounded-top">
                        <div class="p-1">Sinnoh Region</div>
                        </a>
                    </div>
                    <div class="region-button">
                        <a href="/region/Unova" class="btn btn-primary text-center w-100 p-0 region-button" role="button">
                        <img src="/icons/Unova.png" alt="Unova Region" class="img-fluid rounded-top">
                        <div class="p-1">Unova Region</div>
                        </a>
                    </div>
                    <div class="region-button">
                        <a href="/region/Kalos" class="btn btn-primary text-center w-100 p-0 region-button" role="button">
                        <img src="/icons/Kalos.png" alt="Kalos Region" class="img-fluid rounded-top">
                        <div class="p-1">Kalos Region</div>
                        </a>
                    </div>
                    <div class="region-button">
                        <a href="/region/Alola" class="btn btn-primary text-center w-100 p-0 region-button" role="button">
                        <img src="/icons/Alola.png" alt="Alola Region" class="img-fluid rounded-top">
                        <div class="p-1">Alola Region</div>
                        </a>
                    </div>
                    <div class="region-button">
                        <a href="/region/Galar" class="btn btn-primary text-center w-100 p-0 region-button" role="button">
                        <img src="/icons/Galar.png" alt="Galar Region" class="img-fluid rounded-top">
                        <div class="p-1">Galar/Hisui Region</div>
                        </a>
                    </div>
                    <div class="region-button">
                        <a href="/region/Paldea" class="btn btn-primary text-center w-100 p-0 region-button" role="button">
                        <img src="/icons/Paldea.png" alt="Paldea Region" class="img-fluid rounded-top">
                        <div class="p-1">Paldea Region</div>
                        </a>
                    </div>
                    <div class="region-button">
                        <a href="/region/All" class="btn btn-primary text-center w-100 p-0 region-button" role="button">
                        <img src="/icons/ViewAll.png" alt="View All" class="img-fluid rounded-top">
                        <div class="p-1">View All</div>
                        </a>
                    </div>
                </div>
            </div>
            <!--Region End -->
        </main>

        <footer class="py-5">
            <p>Built by Brandon Evans</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </div>
</body>
</html>
